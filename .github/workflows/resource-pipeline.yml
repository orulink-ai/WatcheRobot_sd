name: Resource Pipeline

on:
  push:
    paths:
      - "config/**"
      - "official/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/resource-pipeline.yml"
  pull_request:
    paths:
      - "config/**"
      - "official/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/resource-pipeline.yml"

permissions:
  contents: read

jobs:
  resource-pipeline:
    name: Resource Pipeline Tests
    runs-on: windows-latest

    steps:
      - name: Checkout resource repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run resource pipeline tests
        run: python -m unittest discover -s tests -v
